name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:  # allows manual trigger from GitHub UI

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Deno (JS runtime required by yt-dlp for YouTube)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download FFmpeg
        run: |
          curl -L -o ffmpeg.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
          tar -xf ffmpeg.zip
          copy ffmpeg-master-latest-win64-gpl\bin\ffmpeg.exe ffmpeg.exe

      - name: Bundle Deno runtime
        run: |
          copy (Get-Command deno).Source deno.exe
        shell: pwsh

      - name: Build EXE
        run: python build_app.py

      - name: Upload Nabbr.exe
        uses: actions/upload-artifact@v4
        with:
          name: Nabbr-Windows
          path: dist/Nabbr.exe
