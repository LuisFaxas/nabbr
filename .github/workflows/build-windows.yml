name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:  # allows manual trigger from GitHub UI

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Deno (JS runtime required by yt-dlp for YouTube)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download and verify FFmpeg
        shell: pwsh
        run: |
          # Pin to a specific release for reproducibility
          $ffmpegUrl = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          curl -L -o ffmpeg.zip $ffmpegUrl
          # Log the hash for audit trail (update $expectedHash after first successful build)
          $actualHash = (Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash
          Write-Host "FFmpeg SHA256: $actualHash"
          tar -xf ffmpeg.zip
          copy ffmpeg-master-latest-win64-gpl\bin\ffmpeg.exe ffmpeg.exe
          # Verify the binary runs
          .\ffmpeg.exe -version

      - name: Bundle Deno runtime
        shell: pwsh
        run: |
          $denoPath = (Get-Command deno).Source
          copy $denoPath deno.exe
          # Verify the binary runs
          .\deno.exe --version

      - name: Build EXE
        run: python build_app.py

      - name: Upload Nabbr.exe
        uses: actions/upload-artifact@v4
        with:
          name: Nabbr-Windows
          path: dist/Nabbr.exe
